name: duostock
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: duostock
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Watch Apple pickup stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_RUNTIME_MIN: "340"
        run: node duostock.mjs
      - name: Start the next run (keeps it going 24/7 without relying on cron)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run duostock.yml --repo ${{ github.repository }}
